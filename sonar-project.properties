# Identificador único do projeto no SonarQube
sonar.projectKey=pre-ifma
# Nome exibido na interface do SonarQube
sonar.projectName=PREIFMA - FRONTEND

# OBS: Endereço do servidor no .env

# nextJS
# sonar.exclusions=node_modules/**,.next/**,out/**,public/**
sonar.exclusions=node_modules/**,.next/**,out/**,public/**,**/*.test.ts,**/*.test.tsx,**/__tests__/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/__mocks__/**,**/*.d.ts,**/layout.tsx

sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

sonar.sources=src